<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>امنلاک</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="property.css">
<link rel="stylesheet" href="utm.css">
</head>
<body class="splashing">

<div class="splash" id="splash">
  <div class="sp-glow"></div>
  <img class="sp-gif" id="spgif" src="img/logo.png" alt="امنلاک">
  <div class="sp-txt" id="sptxt">
    <b>املاک تخصص ماست</b>
    <span>دیوار که جای ملک نیست</span>
  </div>
  <div class="sp-hint" id="sphint">برای رد کردن لمس کنید</div>
</div>

<header class="appbar">
  <button class="iconbtn" id="menubtn" aria-label="منو">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="ttl" id="bartitle">امنلاک</div>
  <button class="iconbtn themebtn" id="themebtn" aria-label="حالت شب">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
  <button class="iconbtn" id="backbtn" aria-label="بازگشت" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg>
  </button>
</header>

<div class="scrim" id="scrim"></div>

<nav class="drawer" id="drawer">
  <div class="dhead">
    <img src="img/logo.png" alt="لوگو">
    <div>
      <b>امنلاک</b>
      <span>محاسبات ساختمان و املاک</span>
    </div>
  </div>
  <div class="dscroll" id="dscroll"></div>
  <div class="dbottom" id="dbottom"></div>
  <div class="dfoot">ساختمان و املاک، دقیق‌تر و ساده‌تر • نسخه آزمایشی ۰.۲</div>
</nav>

<main id="main"></main>

<nav class="bottomnav" id="bottomnav" aria-label="ناوبری اصلی">
  <button class="bn on" data-view="home" onclick="goTab('home')"><span class="bn-symbol" data-ui-icon="map"></span><b>نقشه</b></button>
  <button class="bn" data-view="register" onclick="goTab('register')"><span class="bn-symbol" data-ui-icon="plus"></span><b>ثبت ملک</b></button>
  <button class="bn" data-view="tools" onclick="goTab('tools')"><span class="bn-symbol" data-ui-icon="calculator"></span><b>محاسبات</b></button>
  <button class="bn" data-view="account" onclick="goTab('account')"><span class="bn-symbol" data-ui-icon="user"></span><b>حساب من</b></button>
</nav>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="calculators.js"></script>
<script src="app.js"></script>
<script src="property.js"></script>
<script src="utm.js"></script>
</body>
</html>
